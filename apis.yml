aid: wooga
name: Wooga
description: Wooga is a Berlin-based mobile game developer founded in 2009 and a subsidiary
  of Playtika, specializing in story-driven casual games such as June's Journey, Ghost
  Detective and Pearl's Peril. Wooga publishes no public API or developer portal, but
  maintains an active open-source GitHub organization with its atlas Gradle plugin
  suite for Unity and mobile build automation, published to the Gradle Plugin Portal
  and RubyGems. Surfaced in the API Evangelist network as a portfolio company of
  balderton-capital and hv-capital.
