  no public API, so these are not API client SDKs — they are the open-source
  "atlas" Gradle plugin suite for Unity/mobile build automation (published to
  the Gradle Plugin Portal under net.wooga.*) plus Wooga-published Ruby gems.
  Ownership verified via the Gradle Plugin Portal namespace and RubyGems
  homepage links back to github.com/wooga. NuGet Paket.Unity3D and hex.pm
  eflatbuffers were checked but are published under individual/other accounts,
  so they are excluded.
